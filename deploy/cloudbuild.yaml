# SlateMatch on Cloud Run (asia-south1). Set secrets in Secret Manager and grant
# the Cloud Run service account access; never put secret values in this file.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/slatematch:$SHORT_SHA', '.']
  - name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/slatematch:$SHORT_SHA']
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - slatematch
      - --image=gcr.io/$PROJECT_ID/slatematch:$SHORT_SHA
      - --region=asia-south1
      - --platform=managed
      - --no-allow-unauthenticated
      - --set-env-vars=SLATEMATCH_DATA_DIR=/app/data
      - --set-secrets=SLATEMATCH_BOOTSTRAP_KEY=slatematch-bootstrap:latest,GEMINI_API_KEY=slatematch-gemini:latest
images: ['gcr.io/$PROJECT_ID/slatematch:$SHORT_SHA']
