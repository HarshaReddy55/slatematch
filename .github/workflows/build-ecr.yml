name: Build and push image to Amazon ECR

# Builds the SlateMatch Docker image and pushes it to ECR.
# Required GitHub repository secrets (Settings > Secrets and variables > Actions):
#   AWS_ACCESS_KEY_ID      - access key of the github-deployer IAM user
#   AWS_SECRET_ACCESS_KEY  - its secret key
#   AWS_ACCOUNT_ID         - the 12-digit AWS account id
# Region defaults to ap-south-1 (Mumbai); change AWS_REGION below if needed.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: slatematch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run the pytest suite
        run: python -m pytest backend/tests -q

      - name: Build the Rust kernel and run its tests
        run: cargo test --manifest-path rust-kernel/Cargo.toml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          docker build -t "$REGISTRY/$ECR_REPOSITORY:latest" -t "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}" .
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}"
          echo "Pushed: $REGISTRY/$ECR_REPOSITORY:latest"
